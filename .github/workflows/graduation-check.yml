name: Graduation Check

on:
  schedule:
    - cron: '0 4 1 * *'   # 1st of every month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check graduation thresholds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import json, subprocess, os, datetime

          try:
              metrics = json.load(open('../year-of-goat-2027/data/metrics.json'))
              tools   = json.load(open('../year-of-goat-2027/data/tools.json'))['tools']
          except:
              print("Cannot read data files — run from monorepo context")
              exit(0)

          thresh = metrics['graduation_thresholds']
          tool_map = {t['id']: t for t in tools}

          for m in metrics['tools']:
              tid = m['id']
              t = tool_map.get(tid, {})
              if t.get('status') in ('graduated', 'retired'):
                  continue
              uv = m.get('uv_30d', 0)
              clicks = m.get('click_to_main', 0)
              if uv >= thresh['uv_30d'] and clicks >= thresh['click_to_main']:
                  title = f"🏆 Graduation candidate: {t.get('title', tid)}"
                  body = (
                      f"**Tool:** {t.get('title', tid)} — {t.get('url', '')}\n\n"
                      f"**Metrics (last 30 days):**\n"
                      f"- UV: {uv:,} (threshold: {thresh['uv_30d']:,})\n"
                      f"- Clicks to main site: {clicks} (threshold: {thresh['click_to_main']})\n"
                      f"- Shares: {m.get('share_count', 0)}\n\n"
                      f"**Decision:** Update `data/tools.json` → set `status: graduated` and redirect to `{t.get('funnel', '')}`\n\n"
                      f"> Auto-generated by graduation-check.yml on {datetime.date.today()}"
                  )
                  subprocess.run(['gh','issue','create','--title',title,'--body',body,'--label','graduation','--repo',os.environ['REPO']], check=False)
                  print(f"Opened issue: {title}")
              else:
                  pct_uv = int(uv/thresh['uv_30d']*100)
                  print(f"  {tid}: {uv} UV ({pct_uv}% to graduation)")
          EOF
