name: Seasonal Theme Build (Dispatcher)

# This workflow triggers seasonal.yml in year-of-goat-2027.
# The actual logic lives there so GITHUB_TOKEN can push to its own repo.

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger seasonal workflow in goat repo
        run: |
          curl -s -X POST \
            "https://api.github.com/repos/daligao/year-of-goat-2027/actions/workflows/seasonal.yml/dispatches" \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"ref":"main"}' && echo "Dispatched" || echo "Need GH_PAT secret — add at: github.com/daligao/site-operations/settings/secrets"
