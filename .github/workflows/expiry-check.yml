name: 90-Day Experiment Review

on:
  schedule:
    - cron: '0 5 * * 1'   # Every Monday
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for experiments past review date
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import json, subprocess, os, datetime

          import urllib.request
          try:
              url = 'https://raw.githubusercontent.com/daligao/year-of-goat-2027/main/data/tools.json'
              with urllib.request.urlopen(url) as r: data = json.loads(r.read())
          except Exception as e:
              print(f"Cannot fetch tools.json: {e}"); exit(0)

          today = datetime.date.today()
          for t in data['tools']:
              launched = t.get('launched')
              review_days = t.get('review_after_days', 90)
              if not launched or t.get('status') in ('graduated','retired'):
                  continue
              launch_date = datetime.date.fromisoformat(launched)
              review_date = launch_date + datetime.timedelta(days=review_days)
              days_past = (today - review_date).days
              if days_past >= 0:
                  title = f"⏰ Review due: {t['title']} ({days_past}d overdue)"
                  body = (
                      f"**Experiment:** {t['emoji']} {t['title']}\n"
                      f"**URL:** https://chinesefortunetools.online{t['url']}\n"
                      f"**Launched:** {launched}\n"
                      f"**Review was due:** {review_date} ({days_past} days ago)\n\n"
                      f"**Check metrics at:** https://analytics.google.com (G-GZSPJFQ6FR)\n\n"
                      f"**Decide:**\n"
                      f"- 🔥 Growing → set `status: growing` in tools.json\n"
                      f"- 🏆 Qualify → set `status: graduated`, add redirect\n"
                      f"- 🪦 Dead → set `status: retired`\n"
                      f"- 🔄 Continue → bump `launched` date to reset timer\n\n"
                      f"> Auto-generated by expiry-check.yml on {today}"
                  )
                  subprocess.run(['gh','issue','create','--title',title,'--body',body,'--label','experiment-review','--repo',os.environ['REPO']], check=False)
                  print(f"Issue opened: {title}")
              else:
                  print(f"  {t['id']}: review in {-days_past}d (on {review_date})")
          EOF
