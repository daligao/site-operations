name: Page Element Monitor

on:
  schedule:
    - cron: '0 2 * * 1'   # Weekly Monday (runs before audit)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install requests beautifulsoup4 lxml

      - name: Run page monitor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 scripts/page-monitor.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/page-snapshots/
          git diff --staged --quiet || git commit -m "monitor: page snapshot $(date +%Y-%m-%d) [skip ci]"
          git push
