name: Weekly Changelog Generator

on:
  schedule:
    - cron: '0 8 * * 1'   # Every Monday 08:00 UTC (after audit + monitor)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/changelog.py

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/changelog.json data/changelog.md
          git diff --staged --quiet || git commit -m "changelog: weekly update $(date +%Y-%m-%d) [skip ci]"
          git push
